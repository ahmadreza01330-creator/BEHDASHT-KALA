<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>داشبورد | بهداشت کالا</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f1f5f9;
            color: #0f172a;
        }

        header {
            background: linear-gradient(135deg, #166534, #15803d);
            color: white;
            padding: 20px;
        }

        .header-content {
            max-width: 1300px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .brand h1 {
            margin: 0;
            font-size: 25px;
        }

        .brand p {
            margin: 7px 0 0;
            opacity: .9;
            font-size: 13px;

        .logout {
            border: none;
            background: rgba(255,255,255,.15);
            color: white;
            padding: 11px 18px;
            border-radius: 10px;

        }

        main {
            max-width: 1300px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .welcome {
            background: white;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,.05);
        }

        .welcome h2 {
            margin-top: 0;

            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat {

            border-radius: 16px;

            box-shadow: 0 5px 20px rgba(0,0,0,.05);
        }

        .stat-title {
            color: #64748b;
            font-size: 14px;
        }

        .stat-number {
            font-size: 30px;
            font-weight: bold;
            margin-top: 8px;
        }

        .toolbar {
            background: white;
            padding: 18px;
            border-radius: 16px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .toolbar input,
        .toolbar select {
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
        }

        .toolbar input {
            flex: 1;
            min-width: 220px;
        }

        .add-btn {
            background: #16a34a;

            border-radius: 10px;
            padding: 12px 20px;

            object-fit: cover;
        }

        .no-image {
            font-size: 50px;
        }

        .product-body {
            padding: 17px;
        }

        .product-name {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .product-info {
            color: #64748b;
            font-size: 13px;
            line-height: 2;
        }

            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
        }

            background: #dcfce7;
            color: #166534;
        }

        .orange {
            background: #ffedd5;
            color: #9a3412;
        }

        .red {
            background: #fee2e2;
            color: #991b1b;
        }

        .black {
            background: #e2e8f0;
            color: #0f172a;
        }

        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .actions button {
            border: none;
            padding: 10px;
            border-radius: 9px;
            cursor: pointer;
        }

        .details {
            background: #e0f2fe;
        }

        .inventory {
            background: #dcfce7;
        }

        .edit {
            background: #fef3c7;
        }

        .delete {
            background: #fee2e2;
            color: #991b1b;
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.55);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            background: white;
            border-radius: 20px;
            padding: 25px;
        }

        .modal-box h2 {
            margin-top: 0;
        }

        .close {
            float: left;
            border: none;
            background: #fee2e2;
            color: #991b1b;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
        }

        .inventory-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .inventory-row input,
        .inventory-row select {
            flex: 1;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
        }

        .inventory-add {
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            cursor: pointer;
        }

        .inventory-remove {
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            cursor: pointer;
        }

        .history {
            margin-top: 20px;
        }

        .history-item {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 13px;
        }

        @media (max-width: 900px) {

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .products {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {

            .header-content {
                flex-direction: column;
                align-items: stretch;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .products {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

            </div>

        </div>

</div>


<script>

/*
==================================================
  IMPORTANT
  Render / Production Ready
==================================================
*/

const API_URL = "";


let token =
    localStorage.getItem("token");


let products = [];


let selectedInventoryProduct = null;


/*
==================================================
  AUTH
==================================================
*/

if (!token) {

    window.location.href =
        "login.html";

}


/*
==================================================
  API
==================================================
*/

async function api(
    url,
    options = {}
) {

    options.headers = {

        ...(options.headers || {}),

        Authorization:
            `Bearer ${token}`

    };


    const response =
        await fetch(
            API_URL + url,
            options
        );


    if (response.status === 401) {

        localStorage.removeItem(
            "token"
        );

        localStorage.removeItem(
            "seller"
        );

        window.location.href =
            "login.html";

        return null;

    }


    let data;

    try {

        data =
            await response.json();

    }

    catch {

        throw new Error(
            "پاسخ نامعتبر از سرور دریافت شد."
        );

    }


    if (!response.ok) {

        throw new Error(
            data.message ||
            "خطا در ارتباط با سرور"
        );

    }


    return data;

}


/*
==================================================
  PROFILE
==================================================
*/

async function loadProfile() {

    try {

        const data =
            await api(
                "/api/profile"
            );


        if (!data) return;


        const seller =
            data.seller ||
            data;


        document
            .getElementById("sellerName")
            .textContent =

            `${seller.first_name || ""} ${seller.last_name || ""}`.trim()

            ||

            seller.username

            ||

            "فروشنده";


        document
            .getElementById("storeInfo")
            .textContent =

            `${seller.store_name || "فروشگاه"} | ${seller.store_type || ""} | ${seller.city || ""}`;

    }

    catch (error) {

        console.error(error);

    }

}


/*
==================================================
  PRODUCTS
==================================================
*/

async function loadProducts() {

    try {

        const data =
            await api(
                "/api/products"
            );


        if (!data) return;


        products =
            Array.isArray(data)

                ? data

                : (
                    data.products ||
                    []
                );


        renderProducts();

    }

    catch (error) {

        console.error(error);


        document
            .getElementById("products")
            .innerHTML =

            `
            <div
                style="
                    background:white;
                    padding:20px;
                    border-radius:15px;
                "
            >

                خطا در دریافت کالاها

            </div>
            `;

    }

}


/*
==================================================
  JALALI DATE
==================================================
*/

function getToday() {

    const parts =
        new Intl.DateTimeFormat(

            "fa-IR-u-ca-persian",

            {
                year: "numeric",
                month: "2-digit",
                day: "2-digit"
            }

        ).formatToParts(
            new Date()
        );


    const y =
        parts.find(
            x => x.type === "year"
        ).value;


    const m =
        parts.find(
            x => x.type === "month"
        ).value;


    const d =
        parts.find(
            x => x.type === "day"
        ).value;


    return `${y}/${m}/${d}`;

}


/*
==================================================
  JALALI -> GREGORIAN
==================================================
*/

function jalaliToGregorian(
    jy,
    jm,
    jd
) {

    jy = Number(jy);
    jm = Number(jm);
    jd = Number(jd);


    let gy;

    if (jy > 979) {

        gy = 1600;

        jy -= 979;

    }

    else {

        gy = 621;

    }


    const days =
        (365 * jy)

        +

        Math.floor(jy / 33) * 8

        +

        Math.floor(
            ((jy % 33) + 3) / 4
        )

        +

        78

        +

        jd

        +

        (
            jm < 7
                ? (jm - 1) * 31
                : ((jm - 7) * 30) + 186
        );


    gy +=
        400 *
        Math.floor(
            days / 146097
        );


    let remaining =
        days % 146097;


    if (remaining > 36524) {

        gy +=
            100 *
            Math.floor(
                --remaining / 36524
            );

        remaining %= 36524;


        if (remaining >= 365) {

            remaining++;

        }

    }


    gy +=
        4 *
        Math.floor(
            remaining / 1461
        );


    remaining %= 1461;


    if (remaining > 365) {

        gy +=
            Math.floor(
                (remaining - 1) / 365
            );

        remaining =
            (remaining - 1) % 365;

    }


    let gd =
        remaining + 1;


    const leap =
        (
            gy % 4 === 0
            &&
            (
                gy % 100 !== 0
                ||
                gy % 400 === 0
            )
        );


    const monthDays = [

        31,

        leap ? 29 : 28,

        31,

        30,

        31,

        30,

        31,

        31,

        30,

        31,

        30,

        31

    ];


    let gm = 1;


    while (
        gd >
        monthDays[gm - 1]
    ) {

        gd -=
            monthDays[gm - 1];

        gm++;

    }


    return {
        year: gy,
        month: gm,
        day: gd
    };

}


/*
==================================================
  DAYS LEFT
==================================================
*/

function daysLeft(
    expirationDate
) {

    if (!expirationDate)
        return 0;


    const parts =
        String(expirationDate)
            .replaceAll("-", "/")
            .split("/");


    if (
        parts.length !== 3
    ) {

        return 0;

    }


    const converted =
        jalaliToGregorian(
            parts[0],
            parts[1],
            parts[2]
        );


    const date =
        new Date(
            converted.year,
            converted.month - 1,
            converted.day
        );


    const today =
        new Date();


    today.setHours(
        0,
        0,
        0,
        0
    );


    date.setHours(
        0,
        0,
        0,
        0
    );


    return Math.round(
        (
            date - today
        )
        /
        (
            1000 *
            60 *
            60 *
            24
        )
    );

}


/*
==================================================
  EXPIRY INFO
==================================================
*/

function expiryInfo(
    date
) {

    const days =
        daysLeft(date);


    if (days < 0) {

        return {

            text:
                `⚫ منقضی شده (${Math.abs(days)} روز قبل)`,

            className:
                "black"

        };

    }


    if (days === 0) {

        return {

            text:
                "🚨 امروز تاریخ انقضاست! 🚨",

            className:
                "red"

        };

    }


    if (days < 7) {

        return {

            text:
                `🔴 ${days} روز تا انقضا`,

            className:
                "red"

        };

    }


    if (days <= 30) {

        return {

            text:
                `🟠 ${days} روز تا انقضا`,

            className:
                "orange"

        };

    }


    return {

        text:
            `🟢 ${days} روز تا انقضا`,

        className:
            "green"

    };

}


/*
==================================================
  ESCAPE HTML
==================================================
*/

function escapeHtml(
    value
) {

    return String(value ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/*
==================================================
  RENDER PRODUCTS
==================================================
*/

function renderProducts() {

    const container =
        document.getElementById(
            "products"
        );


    const search =
        document
            .getElementById("search")
            .value
            .trim()
            .toLowerCase();


    const filter =
        document
            .getElementById("filter")
            .value;


    let filtered =
        [...products];


    /*
    SEARCH
    */

    if (search) {

        filtered =
            filtered.filter(
                product =>

                    String(
                        product.name || ""
                    )
                    .toLowerCase()
                    .includes(search)

                    ||

                    String(
                        product.barcode || ""
                    )
                    .toLowerCase()
                    .includes(search)
            );

    }


    /*
    FILTER
    */

    filtered =
        filtered.filter(
            product => {

                const days =
                    daysLeft(
                        product.expiration_date
                    );


                if (
                    filter === "near"
                ) {

                    return (
                        days >= 0
                        &&
                        days <= 30
                    );

                }


                if (
                    filter === "expired"
                ) {

                    return days < 0;

                }


                if (
                    filter === "low"
                ) {

                    return (
                        Number(
                            product.stock
                        )
                        <=
                        Number(
                            product.min_stock || 0
                        )
                    );

                }


                return true;

            }
        );


    /*
    CLOSEST EXPIRY FIRST
    */

    filtered.sort(
        (a, b) =>

            daysLeft(
                a.expiration_date
            )

            -

            daysLeft(
                b.expiration_date
            )
    );


    updateStats();


    if (!filtered.length) {

        container.innerHTML =

            `
            <div
                style="
                    background:white;
                    padding:30px;
                    border-radius:18px;
                    text-align:center;
                    grid-column:1/-1;
                "
            >

                📦 کالایی پیدا نشد.

            </div>
            `;

        return;

    }


    container.innerHTML =

        filtered.map(
            product => {

                const expiry =
                    expiryInfo(
                        product.expiration_date
                    );


                const low =

                    Number(
                        product.stock
                    )

                    <=

                    Number(
                        product.min_stock || 0
                    );


                /*
                IMAGE
                */

                const image =
                    product.image

                        ?

                        `<img
                            src="${escapeHtml(product.image)}"
                            alt="${escapeHtml(product.name)}"
                        >`

                        :

                        `<div class="no-image">
                            📦
                        </div>`;


                return `

                <div class="product">

                    <div class="product-image">

                        ${image}

                    </div>


                    <div class="product-body">


                        <div class="product-name">

                            ${escapeHtml(
                                product.name
                            )}

                        </div>


                        <div class="product-info">

                            دسته‌بندی:

                            ${escapeHtml(
                                product.category ||
                                "بدون دسته"
                            )}

                            <br>


                            قیمت فروش:

                            ${Number(
                                product.sale_price || 0
                            ).toLocaleString()}

                            تومان

                            <br>


                            موجودی:

                            <strong>
                                ${product.stock || 0}
                            </strong>

                            <br>


                            بارکد:

                            ${escapeHtml(
                                product.barcode || "-"
                            )}

                        </div>


                        <div
                            class="expiry ${expiry.className}"
                        >

                            ${expiry.text}

                        </div>


                        ${
                            low

                            ?

                            `
                            <div
                                class="expiry red"
                            >

                                ⚠️ موجودی به حداقل رسیده

                            </div>
                            `

                            :

                            ""
                        }


                        <div class="actions">


                            <button
                                class="details"
                                onclick="showDetails(${product.id})"
                            >

                                👁 جزئیات

                            </button>


                            <button
                                class="inventory"
                                onclick="openInventory(${product.id})"
                            >

                                📦 موجودی

                            </button>


                            <button
                                class="edit"
                                onclick="editProduct(${product.id})"
                            >

                                ✏️ ویرایش

                            </button>


                            <button
                                class="delete"
                                onclick="deleteProduct(${product.id})"
                            >

                                🗑 حذف

                            </button>


                        </div>

                    </div>

                </div>

                `;

            }
        ).join("");

}


/*
==================================================
  STATS
==================================================
*/

function updateStats() {

    let near = 0;

    let expired = 0;

    let low = 0;


    products.forEach(
        product => {

            const days =
                daysLeft(
                    product.expiration_date
                );


            if (
                days < 0
            ) {

                expired++;

            }

            else if (
                days <= 30
            ) {

                near++;

            }


            if (
                Number(
                    product.stock
                )
                <=
                Number(
                    product.min_stock || 0
                )
            ) {

                low++;

            }

        }
    );


    document
        .getElementById(
            "totalProducts"
        )
        .textContent =
        products.length;


    document
        .getElementById(
            "nearExpiry"
        )
        .textContent =
        near;


    document
        .getElementById(
            "expired"
        )
        .textContent =
        expired;


    document
        .getElementById(
            "lowStock"
        )
        .textContent =
        low;

}


/*
==================================================
  INVENTORY
==================================================
*/

async function openInventory(
    id
) {

    const product =
        products.find(
            x => x.id === id
        );


    if (!product)
        return;


    selectedInventoryProduct =
        product;


    document
        .getElementById(
            "inventoryProductName"
        )
        .textContent =
        product.name;


    document
        .getElementById(
            "currentStock"
        )
        .textContent =
        product.stock || 0;


    document
        .getElementById(
            "inventoryQuantity"
        )
        .value = "";


    document
        .getElementById(
            "inventoryReason"
        )
        .value = "";


    document
        .getElementById(
            "inventoryModal"
        )
        .classList
        .add("active");


    await loadInventoryHistory(id);

}


/*
==================================================
  CLOSE INVENTORY
==================================================
*/

function closeInventory() {

    document
        .getElementById(
            "inventoryModal"
        )
        .classList
        .remove("active");


    selectedInventoryProduct =
        null;

}


/*
==================================================
  CHANGE INVENTORY
==================================================
*/

async function changeInventory(
    type
) {

    if (
        !selectedInventoryProduct
    )
        return;


    const quantity =
        Number(
            document
                .getElementById(
                    "inventoryQuantity"
                )
                .value
        );


    const reason =
        document
            .getElementById(
                "inventoryReason"
            )
            .value
            .trim();


    if (
        !quantity ||
        quantity <= 0
    ) {

        alert(
            "تعداد را وارد کنید."
        );

        return;

    }


    try {

        await api(

            `/api/products/${selectedInventoryProduct.id}/inventory`,

            {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify({

                        type,

                        quantity,

                        reason

                    })

            }

        );


        alert(

            type === "add"

                ?

                "موجودی با موفقیت افزایش یافت."

                :

                "موجودی با موفقیت کاهش یافت."

        );


        await loadProducts();


        selectedInventoryProduct =

            products.find(

                x =>
                    x.id ===
                    selectedInventoryProduct.id

            );


        document
            .getElementById(
                "currentStock"
            )
            .textContent =
            selectedInventoryProduct.stock;


        await loadInventoryHistory(
            selectedInventoryProduct.id
        );


        document
            .getElementById(
                "inventoryQuantity"
            )
            .value = "";

    }

    catch (error) {

        alert(
            error.message
        );

    }

}


/*
==================================================
  HISTORY
==================================================
*/

async function loadInventoryHistory(
    id
) {

    const list =
        document.getElementById(
            "historyList"
        );


    list.innerHTML =
        "در حال دریافت تاریخچه...";


    try {

        const data =
            await api(
                `/api/products/${id}/inventory-history`
            );


        const history =
            Array.isArray(data)

                ?

                data

                :

                (
                    data.history ||
                    []
                );


        if (
            !history.length
        ) {

            list.innerHTML =
                "هنوز تغییری برای این کالا ثبت نشده است.";

            return;

        }


        list.innerHTML =

            history
                .map(
                    item => {

                        const icon =

                            item.type === "add"

                                ?

                                "🟢"

                                :

                                "🔴";


                        const action =

                            item.type === "add"

                                ?

                                "افزایش موجودی"

                                :

                                "کاهش موجودی";


                        return `

                            <div
                                class="history-item"
                            >

                                ${icon}

                                <strong>
                                    ${action}
                                </strong>

                                <br>

                                تعداد:
                                ${item.quantity}

                                <br>

                                موجودی:

                                ${item.previous_stock}

                                ←

                                ${item.new_stock}

                                <br>

                                دلیل:

                                ${escapeHtml(
                                    item.reason || "-"
                                )}

                            </div>

                        `;

                    }
                )
                .join("");

    }

    catch (error) {

        list.innerHTML =
            "خطا در دریافت تاریخچه.";

        console.error(error);

    }

}


/*
==================================================
  DETAILS
==================================================
*/

function showDetails(
    id
) {

    const product =
        products.find(
            x => x.id === id
        );


    if (!product)

).toLocaleString()} تومان

تاریخ انقضا: ${product.expiration_date || "-"}

بارکد: ${product.barcode || "-"}

توضیحات: ${product.description || "-"}`

    );

}


/*
==================================================
  DELETE PRODUCT
==================================================
*/

async function deleteProduct(
    id
) {

    const product =
        products.find(
            x => x.id === id
        );


    if (!product)
        return;


    const confirmed =
        confirm(

            `آیا از حذف کالای «${product.name}» مطمئن هستید؟`

        );


    if (!confirmed)
        return;


    try {

        await api(

            `/api/products/${id}`,

            {

                method: "DELETE"

            }

        );


        alert(
            "کالا با موفقیت حذف شد."
        );


        await loadProducts();

    }

    catch (error) {

        alert(
            error.message
        );

    }

}


/*
==================================================
  EDIT PRODUCT
==================================================
*/

async function editProduct(
    id
) {

    const product =
        products.find(
            x => x.id === id
        );


    if (!product)
        return;


    const name =
        prompt(
            "نام کالا:",
            product.name || ""
        );


    if (
        name === null
    )
        return;


    const salePrice =
        prompt(
            "قیمت فروش:",
            product.sale_price || ""
        );


    if (
        salePrice === null
    )
        return;


    const minStock =
        prompt(
            "حداقل موجودی:",
            product.min_stock || 0
        );


    if (
        minStock === null
    )
        return;


    try {

        await api(

            `/api/products/${id}`,

            {

                method: "PUT",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify({

                        ...product,

                        name:
                            name.trim(),

                        sale_price:
                            Number(
                                salePrice
                            ),

                        min_stock:
                            Number(
                                minStock
                            )

                    })

            }

        );


        alert(
            "اطلاعات کالا با موفقیت ویرایش شد."
        );


        await loadProducts();

    }

    catch (error) {

        alert(
            error.message
        );

    }

}

function logout() {

    localStorage.removeItem(
        "token"
    );

    localStorage.removeItem(
        "seller"
    );


    window.location.href =
        "login.html";

}

==================================================
  INITIAL LOAD
==================================================
*/

async function initializeDashboard() {

    await loadProfile();

    await loadProducts();

}


/*
==================================================
  REFRESH EXPIRY
  EVERY MINUTE
==================================================
*/

setInterval(

    () => {

        if (
            document.visibilityState ===
            "visible"
        ) {

            renderProducts();

        }

    },

    60 * 1000

);


/*
==================================================
  REFRESH WHEN TAB BECOMES ACTIVE
==================================================
*/

document.addEventListener(

    "visibilitychange",

    () => {

        if (
            document.visibilityState ===
            "visible"
        ) {

            renderProducts();

        }

    }

);


/*
==================================================
  START
==================================================
*/

initializeDashboard();
