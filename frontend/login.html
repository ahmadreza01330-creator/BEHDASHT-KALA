<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود | بهداشت کالا</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Tahoma, Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f172a, #14532d);
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 430px;
            background: white;
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,.25);
        }

        .logo {
            text-align: center;
            font-size: 42px;
            margin-bottom: 5px;
        }

        h1 {
            text-align: center;
            margin: 0;
            color: #166534;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin: 10px 0 30px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #16a34a;
            box-shadow: 0 0 0 3px rgba(22,163,74,.12);
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #16a34a;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #15803d;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
        }

        .error {
            display: block !important;
            background: #fee2e2;
            color: #991b1b;
        }

        .success {
            display: block !important;
            background: #dcfce7;
            color: #166534;
        }

        .register {
            text-align: center;
            margin-top: 22px;
            color: #64748b;
        }

        .register a {
            color: #16a34a;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">🛒</div>

    <h1>بهداشت کالا</h1>

    <div class="subtitle">
        مراقب کالاها باش، سالم به مردم تحویل بده.
    </div>

    <form id="loginForm">

        <label for="username">نام کاربری</label>
        <input
            type="text"
            id="username"
            placeholder="نام کاربری خود را وارد کنید"
            autocomplete="username"
            required
        >

        <label for="password">رمز عبور</label>
        <input
            type="password"
            id="password"
            placeholder="رمز عبور خود را وارد کنید"
            autocomplete="current-password"
            required
        >

        <button type="submit" id="loginBtn">
            ورود به حساب
        </button>

    </form>

    <div id="message"></div>

    <div class="register">
        حساب ندارید؟
        <a href="register.html">ثبت‌نام کنید</a>
    </div>

</div>

<script src="login.js"></script>

</body>
</html>
