<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ثبت نام فروشنده | بهداشت کالا</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        .select-box {
            width: 100%;
            padding: 14px 16px;

            border-radius: 12px;

            border: 1px solid rgba(255,255,255,0.12);

            background: rgba(255,255,255,0.06);

            color: white;

            font-family: inherit;

            font-size: 14px;

            outline: none;

            cursor: pointer;
        }

        .select-box:focus {
            border-color: #72f5d3;
        }

        .select-box option {
            background: #17202b;
            color: white;
        }

        .input-group {
            margin-top: 18px;
        }

        .section-title {
            margin-top: 30px;
            margin-bottom: 10px;

            color: #72f5d3;

            font-size: 18px;
            font-weight: bold;
        }

        .form-grid {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 0 18px;
        }

        @media (max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

        }

        #registerMessage {

            margin-top: 18px;

            text-align: center;

            font-size: 14px;

            min-height: 25px;

        }

    </style>

</head>

<body>

<div class="register-page">

    <div class="register-box">

        <div class="logo">
            🛡️
        </div>

        <h1>
            بهداشت کالا
        </h1>

        <p class="subtitle">
            ثبت نام فروشنده
        </p>

        <p class="description">
            حساب فروشگاه خود را بسازید و مدیریت کالاها و تاریخ انقضای آن‌ها را شروع کنید.
        </p>


        <form id="registerForm">


            <!-- اطلاعات شخصی -->

            <div class="section-title">
                👤 اطلاعات فروشنده
            </div>

            <div class="form-grid">

                <div class="input-group">

                    <label>
                        نام
                    </label>

                    <input
                        type="text"
                        id="firstName"
                        placeholder="مثلاً احمدرضا"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>
                        نام خانوادگی
                    </label>

                    <input
                        type="text"
                        id="lastName"
                        placeholder="مثلاً رضایی"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>
                        شماره تلفن
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="09123456789"
                        required
                    >

                </div>

            </div>


            <!-- اطلاعات فروشگاه -->

            <div class="section-title">
                🏪 اطلاعات فروشگاه
            </div>

            <div class="form-grid">


                <div class="input-group">

                    <label>
                        نام فروشگاه
                    </label>

                    <input
                        type="text"
                        id="storeName"
                        placeholder="مثلاً فروشگاه رضایی"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>
                        نوع فروشگاه
                    </label>

                    <select
                        id="storeType"
                        class="select-box"
                        required
                    >

                        <option value="">
                            انتخاب نوع فروشگاه
                        </option>

                        <option value="سوپرمارکت">
                            سوپرمارکت
                        </option>

                        <option value="فروشگاه مواد غذایی">
                            فروشگاه مواد غذایی
                        </option>

                        <option value="فروشگاه زنجیره‌ای">
                            فروشگاه زنجیره‌ای
                        </option>

                        <option value="فروشگاه بهداشتی">
                            فروشگاه بهداشتی
                        </option>

                        <option value="داروخانه">
                            داروخانه
                        </option>

                        <option value="فروشگاه آرایشی">
                            فروشگاه آرایشی
                        </option>

                        <option value="فروشگاه پروتئینی">
                            فروشگاه پروتئینی
                        </option>

                        <option value="فروشگاه لبنیات">
                            فروشگاه لبنیات
                        </option>

                        <option value="فروشگاه نوشیدنی">
                            فروشگاه نوشیدنی
                        </option>

                        <option value="فروشگاه اینترنتی">
                            فروشگاه اینترنتی
                        </option>

                        <option value="سایر">
                            سایر
                        </option>

                    </select>

                </div>


                <div class="input-group">

                    <label>
                        استان
                    </label>

                    <select
                        id="province"
                        class="select-box"
                        required
                    >

                        <option value="">
                            ابتدا استان را انتخاب کنید
                        </option>

                    </select>

                </div>


                <div class="input-group">

                    <label>
                        شهرستان / شهر
                    </label>

                    <select
                        id="city"
                        class="select-box"
                        required
                        disabled
                    >

                        <option value="">
                            ابتدا استان را انتخاب کنید
                        </option>

                    </select>

                </div>


                <div class="input-group">

                    <label>
                        کد پستی
                    </label>

                    <input
                        type="text"
                        id="postalCode"
                        placeholder="مثلاً 6819876543"
                        maxlength="10"
                        required
                    >

                </div>


            </div>


            <div class="input-group">

                <label>
                    آدرس کامل فروشگاه
                </label>

                <textarea
                    id="address"
                    placeholder="آدرس کامل فروشگاه را وارد کنید"
                    rows="4"
                    required
                ></textarea>

            </div>


            <!-- اطلاعات ورود -->

            <div class="section-title">
                🔐 اطلاعات ورود
            </div>

            <div class="form-grid">

                <div class="input-group">

                    <label>
                        نام کاربری
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="نام کاربری"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>
                        رمز عبور
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="حداقل ۶ کاراکتر"
                        required
                    >

                </div>

            </div>


            <button
                type="submit"
                class="register-btn"
            >

                ثبت نام فروشنده

                <span>
                    ←
                </span>

            </button>


        </form>


        <div id="registerMessage"></div>


        <div class="footer-text">

            بهداشت کالا؛ مراقب کالاها باش، سالم به مردم تحویل بده.

        </div>

    </div>

</div>


<script src="locations.js"></script>

<script src="register.js"></script>

</body>

</html>
